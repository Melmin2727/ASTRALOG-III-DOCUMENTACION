site_name: AstraLog III — Project Charter de Auditoría SDLC
site_description: Project Charter de la Auditoría del Ciclo de Vida del Desarrollo de Software (SDLC) del proyecto AstraLog III
site_author: Equipo Auditor — Grupo 5, Ciclo VII G1

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Inicio: index.md
  - Project Charter:
      - Información general y antecedentes: charter/informacion-general.md
      - Justificación y problema: charter/justificacion.md
      - Objetivos y alcance: charter/objetivos-alcance.md
      - Criterios y metodología: charter/criterios-metodologia.md
      - Entregables y stakeholders: charter/entregables-stakeholders.md
      - Cronograma y presupuesto: charter/cronograma-presupuesto.md
      - Riesgos del proyecto de auditoría: charter/riesgos.md
      - Factores críticos, supuestos y aprobaciones: charter/cierre.md
  - Discrepancias detectadas: discrepancias.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
