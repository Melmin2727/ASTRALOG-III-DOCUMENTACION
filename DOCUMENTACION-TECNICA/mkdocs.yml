site_name: AstraLog III — Documentación Técnica
site_description: Documentación técnica oficial del sistema AstraLog III (ASTRAMACO III)
site_author: Equipo AstraLog III
repo_name: elvisjsAtlas1/Backend-AstramacoIII
repo_url: https://github.com/elvisjsAtlas1/Backend-AstramacoIII
edit_uri: ""

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Inicio: index.md
  - Arquitectura:
      - Visión general: arquitectura/vision-general.md
      - Arquitectura modular: arquitectura/arquitectura-modular.md
      - Flujo general del sistema: arquitectura/flujo-general.md
  - Backend:
      - Visión general: backend/index.md
      - Referencia de API: backend/api-reference.md
      - Modelo de datos: backend/modelo-datos.md
      - Seguridad: backend/seguridad.md
  - Frontend Web: frontend/index.md
  - Aplicación Móvil: movil/index.md
  - Página Publicitaria: pagina-publicitaria/index.md
  - Discrepancias detectadas: discrepancias.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/elvisjsAtlas1
